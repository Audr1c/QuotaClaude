<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude usage</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/diag.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span data-i18n="app.title">Claude usage</span><span class="accent">.</span></h1>
      <div class="tools">
        <span class="meta" id="meta">—</span>
        <div class="seg" role="group" data-i18n-aria="view.label">
          <button type="button" data-view="detail" aria-pressed="true" data-i18n="view.detail">Detailed</button>
          <button type="button" data-view="compact" aria-pressed="false" data-i18n="view.compact">Compact</button>
        </div>
        <div class="seg lang" role="group" data-i18n-aria="lang.label">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <button type="button" class="btn toggle" id="notes" aria-pressed="true" data-i18n-title="notes.title"><span data-i18n="notes.label">Explanations</span></button>
        <button type="button" class="btn" id="refresh" data-i18n-title="refresh.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="refresh">Refresh</span>
        </button>
        <button type="button" class="btn qbtn-big" id="how-open" aria-haspopup="dialog" data-i18n-title="formulas.title" data-i18n-aria="formulas.title">?</button>
      </div>
    </header>
    <div id="err" class="err" hidden></div>
    <div class="layout">
      <main id="app"></main>
      <aside class="hours card" id="hours-box">
        <label class="switch" data-i18n-title="work.hint">
          <input type="checkbox" id="work-on">
          <span class="knob" aria-hidden="true"></span>
          <span class="switch-label" data-i18n="work.toggle">Pace by my working hours</span>
        </label>
        <div id="hours-panel" hidden>
          <h2 data-i18n="hours.title" data-i18n-title="hours.hint">Hours per day</h2>
          <output id="hours-value" for="hours" class="hours-value">8 h</output>
          <div class="slider">
            <div class="ticks" id="hours-ticks" aria-hidden="true"></div>
            <input type="range" id="hours" min="1" max="24" step="1" value="8" data-i18n-aria="hours.aria">
          </div>
        </div>
      </aside>
    </div>
    <dialog id="how" class="how" aria-labelledby="how-title">
      <div class="how-head">
        <h2 id="how-title" data-i18n="formulas.title">How it is computed</h2>
        <span class="hint" data-i18n="formulas.hint">every number, with your values</span>
        <button type="button" class="btn" id="how-close" data-i18n-aria="close" data-i18n-title="close">✕</button>
      </div>
      <div id="how-body"></div>
    </dialog>
  </div>

  <!-- initial data (also works when this page is opened as a plain file) -->
  <script src="../data/latest.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/model.js"></script>
  <script src="js/gauge.js"></script>
  <script src="js/views.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
