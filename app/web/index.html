<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude usage</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/diag.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span data-i18n="app.title">Claude usage</span><span class="accent">.</span></h1>
      <div class="tools">
        <span class="meta" id="meta">—</span>
        <div class="seg" role="group" data-i18n-aria="view.label">
          <button type="button" data-view="detail" aria-pressed="true" data-i18n="view.detail">Detailed</button>
          <button type="button" data-view="compact" aria-pressed="false" data-i18n="view.compact">Compact</button>
        </div>
        <div class="seg lang" role="group" data-i18n-aria="lang.label">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <button type="button" class="btn" id="refresh" data-i18n-title="refresh.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="refresh">Refresh</span>
        </button>
      </div>
    </header>
    <div id="err" class="err" hidden></div>
    <div class="layout">
      <main id="app"></main>
      <aside class="hours card" id="hours-box" data-i18n-title="hours.hint">
        <h2 data-i18n="hours.title">Hours per day</h2>
        <output id="hours-value" for="hours" class="hours-value">8 h</output>
        <div class="slider">
          <div class="ticks" id="hours-ticks" aria-hidden="true"></div>
          <input type="range" id="hours" min="1" max="24" step="1" value="8" data-i18n-aria="hours.aria">
        </div>
      </aside>
    </div>
    <footer class="foot" id="foot"></footer>
  </div>

  <!-- initial data (also works when this page is opened as a plain file) -->
  <script src="../data/latest.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/model.js"></script>
  <script src="js/gauge.js"></script>
  <script src="js/views.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
